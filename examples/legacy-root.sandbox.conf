# Проект, мигрировавший со старой схемы, где публиковался весь
# репозиторий. Оставлено для обратной совместимости.
#
# ВНИМАНИЕ: при publish_dir=. наружу уезжает всё содержимое репозитория,
# включая .env и исходники. Лучше перенести файлы сайта в public/
# и переключиться на publish_dir=public — см. docs/MIGRATION.md.
type=static
publish_dir=.
