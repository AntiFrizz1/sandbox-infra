# Проект, мигрировавший со старой схемы, где публиковался весь
# репозиторий. Оставлено для обратной совместимости.
#
# ВНИМАНИЕ: при publish_dir=. наружу уезжают исходники и всё остальное
# содержимое репозитория. Dot-файлы, .env и ключи не публикуются, но это не
# заменяет отдельный каталог сайта: лучше перенести файлы в public/ и
# переключиться на publish_dir=public — см. docs/ru/deploy-static.md.
type=static
publish_dir=.
