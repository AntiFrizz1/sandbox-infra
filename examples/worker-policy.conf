# Install as /etc/sandbox/projects/<project>.conf, root:root 0644.
# All parent directories must be root-owned and not writable by group/others.
profile=worker
# Fill with a built, scanned, approved worker artifact digest. No tag fallback.
image=
# Conservative candidate defaults; measure on the target VPS before enabling.
timeout_seconds=300
memory_mb=512
pids=128
cpus=1
