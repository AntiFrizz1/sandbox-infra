# Install as /etc/sandbox/projects/<project>.conf, root:root 0644.
# All parent directories must be root-owned and not writable by group/others.
profile=worker
# Fill with a built, scanned, approved worker artifact digest. No tag fallback.
image=
# Conservative candidate defaults; measure on the target VPS before enabling.
timeout_seconds=300
memory_mb=512
pids=128
cpus=1
# Network for the dependency fetch phase (npm ci --ignore-scripts). The build
# phase is always offline. "none" disables fetching; any other network must
# carry the label sandbox.role=build (bootstrap creates sandbox_build).
fetch_network=sandbox_build
# Overrides a registry set in the project's .npmrc.
npm_registry=https://registry.npmjs.org/
