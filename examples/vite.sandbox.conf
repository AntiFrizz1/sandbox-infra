# Vite / React / любой фронтенд со сборкой.
# Хук выполнит build_cmd и опубликует publish_dir.
type=node
build_cmd=npm run build
publish_dir=dist
# Create React App собирает в build/ — тогда publish_dir=build
# SPA-режим: прямой заход на /tools/regex отдаст index.html,
# но отсутствующие .js/.css по-прежнему вернут 404.
spa=true
