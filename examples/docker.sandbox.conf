# Приложение в Docker. Нужен compose-файл в репозитории:
# docker-compose.yml, docker-compose.yaml, compose.yml или compose.yaml.
# Одного Dockerfile недостаточно.
#
# Внешний доступ настраивается лейблами Caddy в самом compose-файле:
#   labels:
#     caddy: myapp.sandbox.example.com
#     caddy.reverse_proxy: "{{upstreams 8080}}"
type=docker
# Необязательно: URL, по которому проверяется готовность приложения
# после подъёма контейнеров.
health_url=http://localhost:8080/health
