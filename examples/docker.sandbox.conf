# Needs a root-owned /etc/sandbox/projects/<name>.conf with profile=compose
# (examples/compose-policy.conf). The compose file must pass the policy check
# described in docs/ru/deploy-docker.md (docs/en/deploy-docker.md).
# Приложение в Docker. Нужен compose-файл в репозитории:
# docker-compose.yml, docker-compose.yaml, compose.yml или compose.yaml.
# Одного Dockerfile недостаточно.
#
# Внешний доступ настраивается лейблами Caddy в самом compose-файле:
#   labels:
#     caddy: myapp.sandbox.example.com
#     caddy.reverse_proxy: "{{upstreams 8080}}"
type=docker
# Необязательно: URL, по которому проверяется готовность приложения
# после подъёма контейнеров.
# Порты наружу не публикуются: адрес только через Caddy, на домене проекта.
health_url=https://myapp.sandbox.example.com/health
