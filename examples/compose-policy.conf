# Install as /etc/sandbox/projects/<project>.conf, root:root 0644, for a
# project with type=docker. Without it the hook refuses to run Compose.
# All parent directories must be root-owned and not writable by group/others.
profile=compose
# Deadline for `docker compose up -d --build`. It stops the CLI; a build
# already handed to the daemon is not interrupted.
timeout_seconds=900
# Enforced on every service through a server-side override; the project's
# own compose file may not set limits.
memory_mb=512
pids=256
cpus=1
