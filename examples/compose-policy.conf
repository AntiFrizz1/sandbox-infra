# Default policy for every Docker project: /etc/sandbox/defaults/compose.conf
# (installed by bootstrap.sh and update-infra.sh). To give one project
# different limits, copy it to /etc/sandbox/projects/<project>.conf — that
# file wins. Without any policy the hook refuses to run Compose.
# root:root 0644; all parent directories root-owned, not group/other-writable.
profile=compose
# Deadline for `docker compose up -d --build`. It stops the CLI; a build
# already handed to the daemon is not interrupted.
timeout_seconds=900
# Enforced on every service through a server-side override; the project's
# own compose file may not set limits.
memory_mb=512
pids=256
cpus=1
